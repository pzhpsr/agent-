<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <rect width="900" height="360" fill="#fff"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="20" fill="#1f2937">Encoder–Decoder Transformer</text>
  <g font-family="Arial,Microsoft YaHei" font-size="15" text-anchor="middle">
    <rect x="90" y="85" width="260" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="220" y="115" fill="#1d4ed8" font-size="18">Encoder × 6</text>
    <rect x="130" y="140" width="180" height="42" rx="6" fill="#dbeafe" stroke="#60a5fa"/><text x="220" y="166">Self-attention</text>
    <rect x="130" y="200" width="180" height="42" rx="6" fill="#dbeafe" stroke="#60a5fa"/><text x="220" y="226">Feed-forward</text>
    <rect x="550" y="85" width="260" height="190" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="680" y="115" fill="#c2410c" font-size="18">Decoder × 6</text>
    <rect x="590" y="135" width="180" height="36" rx="6" fill="#ffedd5" stroke="#fb923c"/><text x="680" y="158">Masked self-attention</text>
    <rect x="590" y="185" width="180" height="36" rx="6" fill="#ffedd5" stroke="#fb923c"/><text x="680" y="208">Cross-attention</text>
    <rect x="590" y="235" width="180" height="36" rx="6" fill="#ffedd5" stroke="#fb923c"/><text x="680" y="258">Feed-forward</text>
  </g>
  <g stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M350 180 L550 180"/>
    <path d="M220 300 L680 300"/>
  </g>
  <text x="450" y="330" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="14" fill="#4b5563">source sequence → encoder states → autoregressive target generation</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
</svg>
